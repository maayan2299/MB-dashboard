<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB — ניהול עסק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#0a0a0a;--white:#fff;--blue:#1a5fd4;--blue-l:#3b82f6;--blue-pale:#e8f0fe;--blue-mid:#1e40af;--g100:#f4f4f5;--g200:#e4e4e7;--g300:#d1d1d6;--g400:#a1a1aa;--g500:#71717a;--g700:#3f3f46;--green:#16a34a;--green-l:#dcfce7;--red:#dc2626;--red-l:#fee2e2;--orange-l:#fef3c7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--g100);color:var(--black);min-height:100vh;direction:rtl;}
.view{display:none;}.view.active{display:block;}
.panel{display:none;}.panel.active{display:block;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);}
.login-box{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.login-logo{font-size:36px;font-weight:900;text-align:center;margin-bottom:8px;}.login-logo span{color:var(--blue-l);}
.login-sub{text-align:center;font-size:13px;color:var(--g400);margin-bottom:28px;}
.login-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.login-group label{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.3px;}
.login-group input{padding:11px 13px;border:1.5px solid var(--g300);border-radius:8px;font-family:'Heebo',sans-serif;font-size:14px;direction:rtl;}
.login-group input:focus{outline:none;border-color:var(--blue);}
.login-btn{width:100%;padding:12px;background:var(--blue);color:white;border:none;border-radius:8px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.login-btn:hover{background:var(--blue-mid);}
.login-error{background:var(--red-l);color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;text-align:center;margin-top:12px;display:none;}

header{background:var(--black);color:var(--white);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--blue);}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px;}.logo span{color:var(--blue-l);}
.header-sub{font-size:10px;color:var(--g400);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:16px;}
#date-disp{font-size:12px;color:var(--g400);}
.logout-btn{font-size:12px;color:var(--g400);background:none;border:1px solid var(--g500);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;}
.logout-btn:hover{color:white;border-color:white;}

.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--g200);padding:0 32px;overflow-x:auto;}
.tab{padding:16px 22px;cursor:pointer;font-size:13px;font-weight:600;color:var(--g500);border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.tab:hover{color:var(--blue);}.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.tab-cnt{background:var(--g100);color:var(--g500);font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;}
.tab.active .tab-cnt{background:var(--blue);color:var(--white);}

.main{padding:24px 32px;max-width:1600px;margin:0 auto;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;font-family:'Heebo',sans-serif;}
.btn-primary{background:var(--blue);color:var(--white);}.btn-primary:hover{background:var(--blue-mid);}
.btn-outline{background:var(--white);color:var(--black);border:1.5px solid var(--g300);}.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-danger{background:var(--red-l);color:var(--red);border:1px solid transparent;}.btn-danger:hover{background:var(--red);color:white;}

/* CATEGORIES GRID */
.categories-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.category-card{background:var(--white);border:1.5px solid var(--g200);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.category-card:hover{border-color:var(--blue);box-shadow:0 8px 24px rgba(26,95,212,.12);transform:translateY(-2px);}
.category-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue);transform:scaleX(0);transition:transform .3s;transform-origin:right;}
.category-card:hover::before{transform:scaleX(1);transform-origin:left;}

.cat-icon{font-size:32px;margin-bottom:12px;}
.cat-name{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--black);}
.cat-stats{display:flex;flex-direction:column;gap:10px;}
.cat-stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--g100);}
.cat-stat-label{font-size:11px;color:var(--g500);font-weight:600;text-transform:uppercase;}
.cat-stat-value{font-size:16px;font-weight:800;}
.csv-green{color:var(--green);}.csv-red{color:var(--red);}.csv-blue{color:var(--blue);}

.add-category-card{background:var(--white);border:2px dashed var(--g300);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;color:var(--g400);}
.add-category-card:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-pale);}
.add-cat-icon{font-size:48px;margin-bottom:12px;}
.add-cat-text{font-size:14px;font-weight:600;}

/* CATEGORY DETAIL VIEW */
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--g200);}
.cat-title{font-size:28px;font-weight:900;display:flex;align-items:center;gap:12px;}
.back-btn{font-size:14px;font-weight:600;color:var(--g500);background:none;border:none;cursor:pointer;padding:6px 12px;border-radius:6px;}
.back-btn:hover{color:var(--blue);background:var(--blue-pale);}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--white);border:1px solid var(--g200);border-radius:10px;padding:16px 18px;}
.stat-label{font-size:10px;color:var(--g400);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.stat-val{font-size:26px;font-weight:800;line-height:1;}
.sv-blue{color:var(--blue);}.sv-green{color:var(--green);}.sv-red{color:var(--red);}

.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sec-title{font-size:20px;font-weight:700;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-input,.filter-select{padding:9px 12px;border:1.5px solid var(--g300);border-radius:8px;font-family:'Heebo',sans-serif;font-size:13px;background:var(--white);direction:rtl;color:var(--black);}
.search-input{flex:1;min-width:180px;}.search-input:focus,.filter-select:focus{outline:none;border-color:var(--blue);}

.table-wrap{background:var(--white);border:1px solid var(--g200);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--black);color:var(--white);padding:11px 13px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--g100);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--blue-pale);}
tbody td{padding:11px 13px;font-size:13px;color:var(--g700);vertical-align:middle;}

.empty{text-align:center;padding:50px 20px;color:var(--g400);}.empty-icon{font-size:36px;margin-bottom:10px;opacity:.4;}.empty-text{font-size:13px;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.modal-backdrop.open{display:flex;}
.modal{background:var(--white);border-radius:14px;padding:28px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;position:relative;direction:rtl;box-shadow:0 24px 60px rgba(0,0,0,.18);}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--g200);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}.fg .full{grid-column:1/-1;}
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:11px;font-weight:700;color:var(--g500);letter-spacing:.3px;text-transform:uppercase;}
.form-group input,.form-group select,.form-group textarea{padding:9px 11px;border:1.5px solid var(--g300);border-radius:7px;font-family:'Heebo',sans-serif;font-size:13px;color:var(--black);background:var(--white);transition:border-color .2s;direction:rtl;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue);}
.form-group textarea{resize:vertical;min-height:65px;}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--g200);}
.close-btn{position:absolute;top:14px;left:14px;background:none;border:none;cursor:pointer;font-size:18px;color:var(--g400);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.close-btn:hover{background:var(--g100);color:var(--black);}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
.loading-overlay.show{display:flex;}
.spinner{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--black);color:white;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.b-spec{background:#e0e7ff;color:#3730a3;}.b-design{background:var(--orange-l);color:#92400e;}
.b-done{background:var(--green-l);color:#15803d;}.b-type{background:var(--g100);color:var(--g700);}

.pi{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.pi-y{background:var(--green-l);color:var(--green);}.pi-n{background:var(--g100);color:var(--g400);}

@media(max-width:768px){.main{padding:14px 16px;}header,.tabs{padding-right:16px;padding-left:16px;}.categories-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--g500);font-weight:600;">טוען...</div>
</div>
<div class="toast" id="toast"></div>

<!-- LOGIN VIEW -->
<div class="view active" id="view-login">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">M<span>B</span></div>
      <div class="login-sub">ניהול עסק דיגיטלי</div>
      <div class="login-group"><label>שם משתמש</label><input id="login-user" placeholder="MB" autocomplete="username"></div>
      <div class="login-group"><label>סיסמה</label><input id="login-pass" type="password" placeholder="••••••" autocomplete="current-password"></div>
      <button class="login-btn" onclick="doLogin()">כניסה</button>
      <div class="login-error" id="login-error">שם משתמש או סיסמה שגויים</div>
    </div>
  </div>
</div>

<!-- MAIN VIEW -->
<div class="view" id="view-main">
  <header>
    <div><div class="logo">M<span>B</span></div><div class="header-sub">ניהול עסק דיגיטלי</div></div>
    <div class="header-right">
      <div id="date-disp"></div>
      <button class="logout-btn" onclick="doLogout()">יציאה</button>
    </div>
  </header>
  
  <div class="main">
    <!-- CATEGORIES GRID -->
    <div style="margin-bottom:32px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h2 style="font-size:24px;font-weight:900;">קטגוריות</h2>
      </div>
      <div class="categories-grid" id="categories-grid"></div>
    </div>

    <!-- CATEGORY DETAIL PANEL -->
    <div id="category-detail" style="display:none;">
      <div class="cat-header">
        <div class="cat-title">
          <button class="back-btn" onclick="backToCategories()">← חזרה</button>
          <span id="cat-detail-name"></span>
        </div>
      </div>
      
      <div class="stats-row" id="cat-detail-stats"></div>
      
      <div class="sec-hdr">
        <div class="sec-title" id="cat-detail-title"></div>
        <button class="btn btn-primary" id="add-item-btn"></button>
      </div>
      
      <div class="toolbar">
        <input class="search-input" placeholder="חיפוש..." oninput="filterCategoryTable()" id="cat-search">
        <select class="filter-select" onchange="filterCategoryTable()" id="cat-detail-filter" style="display:none;"></select>
      </div>
      
      <div class="table-wrap">
        <table><thead id="cat-detail-thead"></thead><tbody id="cat-detail-tbody"></tbody></table>
        <div class="empty" id="cat-detail-empty" style="display:none"><div class="empty-icon">📋</div><div class="empty-text">אין פריטים בקטגוריה זו</div></div>
      </div>
    </div>
  </div>
</div>

<!-- ADD CATEGORY MODAL -->
<div class="modal-backdrop" id="modal-category">
  <div class="modal"><button class="close-btn" onclick="closeModal('category')">✕</button>
    <div class="modal-title">הוספת קטגוריה חדשה</div>
    <div class="fg">
      <div class="form-group"><label>שם הקטגוריה</label><input id="cat-name" placeholder="לדוג׳ אפליקציות, משחקים"></div>
      <div class="form-group"><label>סמל (emoji)</label><input id="cat-icon" placeholder="🎮" maxlength="2"></div>
      <div class="form-group full"><label>תיאור</label><textarea id="cat-desc" placeholder="תיאור קצר של הקטגוריה"></textarea></div>
    </div>
    <div class="form-actions"><button class="btn btn-outline" onclick="closeModal('category')">ביטול</button><button class="btn btn-primary" onclick="saveCategory()">צרי קטגוריה</button></div>
  </div>
</div>

<script>
const SB_URL = 'https://nyofvudlycorlmhddqev.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55b2Z2dWRseWNvcmxtaGRkcWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NjU2NTEsImV4cCI6MjA4NzQ0MTY1MX0.dToPBomhGz9u4SZQVC7pOcijv1Cy4Sg_VbMNBpOOQK4';
const sb = supabase.createClient(SB_URL, SB_KEY);

let websites = [], automations = [], students = [], expenses = [];
let categories = [
  {id:'websites',name:'אתרים',icon:'🌐',table:'websites'},
  {id:'automations',name:'פתרונות דיגיטליים',icon:'⚡',table:'automations'},
  {id:'students',name:'שיעורים פרטיים',icon:'📚',table:'students'}
];
let currentCategory = null;

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  if((u === 'MB' || u === 'mb') && p === 'MB2026!') {
    localStorage.setItem('mb-auth', '1');
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('view-login').classList.remove('active');
    document.getElementById('view-main').classList.add('active');
    loadAll();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  localStorage.removeItem('mb-auth');
  document.getElementById('view-main').classList.remove('active');
  document.getElementById('view-login').classList.add('active');
}

async function loadAll() {
  try {
    const [ws, au, st, ex] = await Promise.all([
      sb.from('websites').select('*'),
      sb.from('automations').select('*'),
      sb.from('students').select('*'),
      sb.from('expenses').select('*')
    ]);
    websites = ws.data || [];
    automations = au.data || [];
    students = st.data || [];
    expenses = ex.data || [];
    document.getElementById('date-disp').textContent = new Date().toLocaleDateString('he-IL');
    renderCategories();
  } catch(e) { 
    console.error(e);
    alert('שגיאה בטעינת נתונים');
  }
}

function getStats(cat) {
  const data = cat.id==='websites'?websites:cat.id==='automations'?automations:students;
  const tot = data.length;
  let rev = 0;
  if(cat.id!=='students') {
    rev = data.reduce((s,item)=>{
      if(item.paid) return s+(parseInt(item.price)||0);
      if(item.advance&&item.advance_amount) return s+(parseInt(item.advance_amount)||0);
      return s;
    },0);
  } else {
    rev = data.flatMap(s=>s.lessons||[])
      .filter(l=>new Date(l.date)<new Date())
      .reduce((s,l)=>s+(parseInt(l.price)||0),0);
  }
  const exp = expenses.reduce((s,e)=>s+(parseInt(e.amount)||0),0);
  return {tot,rev,exp,profit:rev-exp};
}

function renderCategories() {
  const grid = document.getElementById('categories-grid');
  grid.innerHTML = categories.map(cat => {
    const {tot,rev,exp,profit} = getStats(cat);
    return `<div class="category-card" onclick="openCategory('${cat.id}')">
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-stats">
        <div class="cat-stat">
          <span class="cat-stat-label">סה"כ</span>
          <span class="cat-stat-value">${tot}</span>
        </div>
        <div class="cat-stat">
          <span class="cat-stat-label">הכנסות</span>
          <span class="cat-stat-value csv-green">₪${rev.toLocaleString('he-IL')}</span>
        </div>
        <div class="cat-stat">
          <span class="cat-stat-label">הוצאות</span>
          <span class="cat-stat-value csv-red">₪${exp.toLocaleString('he-IL')}</span>
        </div>
        <div class="cat-stat">
          <span class="cat-stat-label">רווח</span>
          <span class="cat-stat-value ${profit>=0?'csv-green':'csv-red'}">₪${profit.toLocaleString('he-IL')}</span>
        </div>
      </div>
    </div>`;
  }).join('') + `<div class="add-category-card" onclick="openModal('category')">
    <div class="add-cat-icon">➕</div>
    <div class="add-cat-text">הוסף קטגוריה חדשה</div>
  </div>`;
}

function openCategory(catId) {
  currentCategory = categories.find(c=>c.id===catId);
  const {tot,rev,exp,profit} = getStats(currentCategory);
  
  document.getElementById('category-detail').style.display = 'block';
  document.getElementById('cat-detail-name').textContent = currentCategory.icon + ' ' + currentCategory.name;
  
  const statHtml = `
    <div class="stat-card"><div class="stat-label">סה"כ</div><div class="stat-val">${tot}</div></div>
    <div class="stat-card"><div class="stat-label">הכנסות</div><div class="stat-val sv-green">₪${rev.toLocaleString('he-IL')}</div></div>
    <div class="stat-card"><div class="stat-label">הוצאות</div><div class="stat-val sv-red">₪${exp.toLocaleString('he-IL')}</div></div>
    <div class="stat-card"><div class="stat-label">רווח</div><div class="stat-val ${profit>=0?'sv-green':'sv-red'}">₪${profit.toLocaleString('he-IL')}</div></div>
  `;
  document.getElementById('cat-detail-stats').innerHTML = statHtml;
  document.getElementById('cat-detail-title').textContent = currentCategory.name;
  
  if(currentCategory.id==='websites') {
    document.getElementById('add-item-btn').textContent = '+ הוסף אתר';
    document.getElementById('cat-detail-thead').innerHTML = '<tr><th>שם</th><th>לקוח</th><th>מחיר</th><th>מקדמה</th><th>שולם</th><th>סטטוס</th><th>פעולות</th></tr>';
    renderWebsitesTable();
  } else if(currentCategory.id==='automations') {
    document.getElementById('add-item-btn').textContent = '+ הוסף פרויקט';
    document.getElementById('cat-detail-thead').innerHTML = '<tr><th>שם</th><th>לקוח</th><th>מחיר</th><th>מקדמה</th><th>שולם</th><th>סטטוס</th><th>פעולות</th></tr>';
    renderAutomationsTable();
  } else if(currentCategory.id==='students') {
    document.getElementById('add-item-btn').textContent = '+ הוסף תלמיד';
    document.getElementById('cat-detail-thead').innerHTML = '<tr><th>שם</th><th>גיל</th><th>נושאים</th><th>מחיר</th><th>פעולות</th></tr>';
    renderStudentsTable();
  }
}

function renderWebsitesTable() {
  const srch = (document.getElementById('cat-search')?.value||'').toLowerCase();
  let items = websites.filter(w => !srch || (w.name+w.client).toLowerCase().includes(srch));
  const tbody = document.getElementById('cat-detail-tbody');
  const empty = document.getElementById('cat-detail-empty');
  empty.style.display = items.length?'none':'block';
  tbody.innerHTML = items.map(w=>`<tr>
    <td>${w.name}</td>
    <td>${w.client||'—'}</td>
    <td>₪${w.price||0}</td>
    <td>${w.advance_amount||'—'}</td>
    <td>${w.paid?'✓':'—'}</td>
    <td><span class="badge b-done">${w.status||'—'}</span></td>
    <td><button class="btn btn-outline btn-sm">עריכה</button></td>
  </tr>`).join('');
}

function renderAutomationsTable() {
  const srch = (document.getElementById('cat-search')?.value||'').toLowerCase();
  let items = automations.filter(a => !srch || (a.name+a.client).toLowerCase().includes(srch));
  const tbody = document.getElementById('cat-detail-tbody');

    <td>${a.name}</td>

    <td>${a.advance_amount||'—'}</td>
    <td>${a.paid?'✓':'—'}</td>
    <td><span class="badge b-design">${a.status||'—'}</span></td>

function renderStudentsTable() {
  const srch = (document.getElementById('cat-search')?.value||'').toLowerCase();
  let items = students.filter(s => !srch || s.name.toLowerCase().includes(srch));
  const tbody = document.getElementById('cat-detail-tbody');
  const empty = document.getElementById('cat-detail-empty');
  empty.style.display = items.length?'none':'block';
  tbody.innerHTML = items.map(s=>`<tr>
    <td>${s.name}</td>
    <td>${s.age||'—'}</td>
    <td>${s.topics||'—'}</td>
    <td>₪${s.price||0}</td>
    <td><button class="btn btn-outline btn-sm">עריכה</button></td>

function filterCategoryTable() {
  if(currentCategory.id==='websites') renderWebsitesTable();
  else if(currentCategory.id==='automations') renderAutomationsTable();
  else if(currentCategory.id==='students') renderStudentsTable();
}

function backToCategories() {
  document.getElementById('category-detail').style.display = 'none';
  currentCategory = null;
}

function openModal(type) {
  document.getElementById('modal-'+type).classList.add('open');
}

function closeModal(type) {
  document.getElementById('modal-'+type).classList.remove('open');
}

async function saveCategory() {
  const name = document.getElementById('cat-name').value.trim();
  const icon = document.getElementById('cat-icon').value.trim();
  if(!name) return alert('אנא הכנסי שם קטגוריה');
  if(!icon) return alert('אנא בחרי סמל');
  
  const newCat = {
    id: name.toLowerCase().replace(/\s+/g,'_'),
    name, icon,
    table: name.toLowerCase().replace(/\s+/g,'_')
  };
  
  categories.push(newCat);
  closeModal('category');
  document.getElementById('cat-name').value = '';
  document.getElementById('cat-icon').value = '';
  renderCategories();
}

document.querySelectorAll('.modal-backdrop').forEach(b => {
  b.addEventListener('click', e => { if(e.target===b) b.classList.remove('open'); });
});

if(localStorage.getItem('mb-auth')==='1') {
  document.getElementById('view-login').classList.remove('active');
  document.getElementById('view-main').classList.add('active');
  loadAll();
}
</script>
