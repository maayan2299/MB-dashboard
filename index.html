<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MB — ניהול עסק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#0a0a0a;--white:#fff;--blue:#1a5fd4;--blue-l:#3b82f6;--blue-pale:#e8f0fe;--blue-mid:#1e40af;--g100:#f4f4f5;--g200:#e4e4e7;--g300:#d1d1d6;--g400:#a1a1aa;--g500:#71717a;--g700:#3f3f46;--green:#16a34a;--green-l:#dcfce7;--red:#dc2626;--red-l:#fee2e2;--orange-l:#fef3c7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--g100);color:var(--black);min-height:100vh;direction:rtl;}
.view{display:none;}.view.active{display:block;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);}
.login-box{background:var(--white);border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.login-logo{font-size:36px;font-weight:900;text-align:center;margin-bottom:8px;}.login-logo span{color:var(--blue-l);}
.login-sub{text-align:center;font-size:13px;color:var(--g400);margin-bottom:28px;}
.login-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.login-group label{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.3px;}
.login-group input{padding:11px 13px;border:1.5px solid var(--g300);border-radius:8px;font-family:'Heebo',sans-serif;font-size:14px;direction:rtl;}
.login-group input:focus{outline:none;border-color:var(--blue);}
.login-btn{width:100%;padding:12px;background:var(--blue);color:white;border:none;border-radius:8px;font-family:'Heebo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.login-btn:hover{background:var(--blue-mid);}
header{background:var(--black);color:var(--white);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--blue);}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px;}.logo span{color:var(--blue-l);}
.header-right{display:flex;align-items:center;gap:16px;}
.logout-btn{font-size:12px;color:var(--g400);background:none;border:1px solid var(--g500);padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;}
.logout-btn:hover{color:white;border-color:white;}
.tabs{display:flex;background:var(--white);border-bottom:1px solid var(--g200);padding:0 32px;overflow-x:auto;}
.tab{padding:16px 22px;cursor:pointer;font-size:13px;font-weight:600;color:var(--g500);border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;}
.tab:hover{color:var(--blue);}.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.main{padding:24px 32px;max-width:1400px;margin:0 auto;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--white);border:1px solid var(--g200);border-radius:10px;padding:16px 18px;}
.stat-label{font-size:10px;color:var(--g400);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.stat-val{font-size:26px;font-weight:800;line-height:1;}
.sv-blue{color:var(--blue);}.sv-green{color:var(--green);}.sv-red{color:var(--red);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;font-family:'Heebo',sans-serif;}
.btn-primary{background:var(--blue);color:var(--white);}.btn-primary:hover{background:var(--blue-mid);}
.btn-outline{background:var(--white);color:var(--black);border:1.5px solid var(--g300);}.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-sm{padding:5px 10px;font-size:12px;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-input,.filter-select{padding:9px 12px;border:1.5px solid var(--g300);border-radius:8px;font-family:'Heebo',sans-serif;font-size:13px;background:var(--white);direction:rtl;color:var(--black);}
.search-input{flex:1;min-width:180px;}.search-input:focus,.filter-select:focus{outline:none;border-color:var(--blue);}
.table-wrap{background:var(--white);border:1px solid var(--g200);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--black);color:var(--white);padding:11px 13px;text-align:right;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
tbody tr{border-bottom:1px solid var(--g100);transition:background .12s;}
tbody tr:hover{background:var(--blue-pale);}
tbody td{padding:11px 13px;font-size:13px;color:var(--g700);}
.empty{text-align:center;padding:50px 20px;color:var(--g400);}
</style>
</head>
<body>

<div class="view active" id="view-login">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">M<span>B</span></div>
      <div class="login-sub">ניהול עסק ופרויקטים</div>
      <div class="login-group">
        <label>שם משתמש</label>
        <input type="text" id="login-user" placeholder="MB" onkeypress="if(event.key==='Enter') doLogin()">
      </div>
      <div class="login-group">
        <label>סיסמה</label>
        <input type="password" id="login-pass" placeholder="••••••" onkeypress="if(event.key==='Enter') doLogin()">
      </div>
      <button class="login-btn" onclick="doLogin()">כניסה</button>
    </div>
  </div>
</div>

<div class="view" id="view-main">
  <header>
    <div class="logo">M<span>B</span></div>
    <div class="header-right">
      <span id="date-disp"></span>
      <button class="logout-btn" onclick="doLogout()">יציאה</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('general')">כללי</div>
    <div class="tab" onclick="switchTab('websites')">אתרים <span style="font-size:10px;background:var(--blue);color:white;padding:2px 6px;border-radius:20px;margin-right:6px;">8</span></div>
    <div class="tab" onclick="switchTab('automations')">פתרונות דיגיטליים <span style="font-size:10px;background:var(--blue);color:white;padding:2px 6px;border-radius:20px;margin-right:6px;">2</span></div>
    <div class="tab" onclick="switchTab('expenses')">הוצאות <span style="font-size:10px;background:var(--blue);color:white;padding:2px 6px;border-radius:20px;margin-right:6px;">2</span></div>
  </div>

  <div class="main">
    <div id="content"></div>
  </div>
</div>

<script>
const SB_URL = 'https://nyofvudlycorlmhddqev.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55b2Z2dWRseWNvcmxtaGRkcWV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NjU2NTEsImV4cCI6MjA4NzQ0MTY1MX0.dToPBomhGz9u4SZQVC7pOcijv1Cy4Sg_VbMNBpOOQK4';
const sb = supabase.createClient(SB_URL, SB_KEY);

let websites = [];
let automations = [];
let expenses = [];

function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value.trim();
  
  if(user === 'MB' && pass === 'MB2026!') {
    localStorage.setItem('mb-auth', '1');
    document.getElementById('view-login').classList.remove('active');
    document.getElementById('view-main').classList.add('active');
    loadAll();
  } else {
    alert('שם משתמש או סיסמה שגויים');
  }
}

function doLogout() {
  localStorage.removeItem('mb-auth');
  location.reload();
}

async function loadAll() {
  try {
    const [ws, au, ex] = await Promise.all([
      sb.from('websites').select('*'),
      sb.from('automations').select('*'),
      sb.from('expenses').select('*')
    ]);
    websites = ws.data || [];
    automations = au.data || [];
    expenses = ex.data || [];
    updateDate();
    switchTab('general');
  } catch(e) {
    console.error('Error:', e);
    alert('שגיאה בטעינת הנתונים: ' + e.message);
  }
}

function updateDate() {
  const d = new Date();
  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  document.getElementById('date-disp').textContent = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabs = document.querySelectorAll('.tab');
  if(tab === 'general') tabs[0].classList.add('active');
  else if(tab === 'websites') tabs[1].classList.add('active');
  else if(tab === 'automations') tabs[2].classList.add('active');
  else if(tab === 'expenses') tabs[3].classList.add('active');
  
  if(tab === 'general') renderGeneral();
  else if(tab === 'websites') renderWebsites();
  else if(tab === 'automations') renderAutomations();
  else if(tab === 'expenses') renderExpenses();
}

function renderGeneral() {
  const wsRev = websites.filter(w=>w.paid).reduce((s,w)=>s+(parseInt(w.price)||0),0);
  const auRev = automations.filter(a=>a.paid).reduce((s,a)=>s+(parseInt(a.price)||0),0);
  const totalExp = expenses.reduce((s,e)=>s+(parseInt(e.amount)||0),0);
  const profit = (wsRev + auRev) - totalExp;

  document.getElementById('content').innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">סה״כ הכנסות</div><div class="stat-val sv-green">₪${(wsRev+auRev).toLocaleString('he-IL')}</div></div>
      <div class="stat-card"><div class="stat-label">סה״כ הוצאות</div><div class="stat-val sv-red">₪${totalExp.toLocaleString('he-IL')}</div></div>
      <div class="stat-card"><div class="stat-label">רווח נקי</div><div class="stat-val ${profit>=0?'sv-green':'sv-red'}">₪${profit.toLocaleString('he-IL')}</div></div>
      <div class="stat-card"><div class="stat-label">פרויקטים פעילים</div><div class="stat-val sv-blue">${websites.length + automations.length}</div></div>
    </div>
  `;
}

function renderWebsites() {
  const html = websites.map(w => `
    <tr>
      <td><strong>${w.name}</strong></td>
      <td>${w.client}</td>
      <td>₪${(w.price||0).toLocaleString('he-IL')}</td>
      <td>${w.status}</td>
      <td>${w.advance ? '✓' : '—'}</td>
      <td>${w.paid ? '✓' : '—'}</td>
    </tr>
  `).join('');
  
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <button class="btn btn-primary">+ אתר חדש</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>שם</th><th>לקוח</th><th>מחיר</th><th>סטטוס</th><th>מקדמה</th><th>בתשלום</th></tr></thead>
        <tbody>${html || '<tr><td colspan="6" style="text-align:center;padding:30px;">אין נתונים</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function renderAutomations() {
  const html = automations.map(a => `
    <tr>
      <td><strong>${a.name}</strong></td>
      <td>${a.client}</td>
      <td>₪${(a.price||0).toLocaleString('he-IL')}</td>
      <td>${a.status}</td>
      <td>${a.advance ? '✓' : '—'}</td>
      <td>${a.paid ? '✓' : '—'}</td>
    </tr>
  `).join('');
  
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <button class="btn btn-primary">+ פתרון חדש</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>שם</th><th>לקוח</th><th>מחיר</th><th>סטטוס</th><th>מקדמה</th><th>בתשלום</th></tr></thead>
        <tbody>${html || '<tr><td colspan="6" style="text-align:center;padding:30px;">אין נתונים</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function renderExpenses() {
  const html = expenses.map(e => `
    <tr>
      <td><strong>${e.name}</strong></td>
      <td>${e.category}</td>
      <td>₪${(e.amount||0).toLocaleString('he-IL')}</td>
      <td>${e.type}</td>
      <td>${e.date}</td>
    </tr>
  `).join('');
  
  document.getElementById('content').innerHTML = `
    <div class="toolbar">
      <button class="btn btn-primary">+ הוצאה חדשה</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>שם</th><th>קטגוריה</th><th>סכום</th><th>סוג</th><th>תאריך</th></tr></thead>
        <tbody>${html || '<tr><td colspan="5" style="text-align:center;padding:30px;">אין נתונים</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// INIT
if(localStorage.getItem('mb-auth')==='1'){ 
  document.getElementById('view-login').classList.remove('active');
  document.getElementById('view-main').classList.add('active');
  loadAll(); 
}
</script>
</body>
</html>
